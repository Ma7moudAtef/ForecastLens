[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastlens"
version = "0.1.0"
description = "Adaptive consumption forecast engine with plain-language explanations"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pre-commit>=3.5",
]
package = [
    "pyinstaller>=6.3",
]

[tool.setuptools]
packages = ["core", "app", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: full-pipeline tests against the sample workbook",
]

[tool.coverage.run]
source = ["core"]
