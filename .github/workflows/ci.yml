name: CI

on:
  push:
  pull_request:

jobs:
  data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No spreadsheets outside the whitelisted sample
        run: python scripts/check_spreadsheets.py --all

  tests:
    runs-on: ubuntu-latest
    needs: data-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Unit, trap and integration tests
        run: pytest --cov=core --cov-report=term-missing
